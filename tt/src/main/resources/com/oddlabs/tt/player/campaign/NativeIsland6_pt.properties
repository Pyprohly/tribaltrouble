header=Var\u00F0ask\u00F3gur
description=Talvez essa seja a ilha secreta que Grimhildur Glut\u00E3o falou sobre, quando ele disse que Fjorleif velejou para o oeste com as est\u00E1tuas.
header0=Chefe Ngumba
dialog0=Morte e Diarreia, sem est\u00E1tuas aqui tamb\u00E9m! Pelo menos parece que alguns de nossos compatriotas montaram um acampamento um pouco acima da costa.
header1=Chefe Gotoba
dialog1=Salve, Chefe Ngumba! N\u00F3s somos um grupo de antigos ref\u00E9ns que consiguiram escapar. Gra\u00E7as ao tamanho impressionante dessa ilha n\u00F3s conseguimos nos esconder dos Vikings. N\u00F3s estamos montando um acampamento aqui para que possamos construir um n\u00E1vio e velejar pra casa.
header2=Chefe Ngumba
dialog2=Que tal n\u00F3s nos aliarmos e expulsarmos os Vikings pra fora dessa ilha ent\u00E3o? Sem vikings para interfirir, eu tenho certeza que a sua constru\u00E7\u00E3o do navio seria muito mais f\u00E1cil.
header3=Chefe Gotoba
dialog3=Soa como um plano... hora bater em Vikings!
header4=Ngolongo P\u00E9s-\u00E1geis
dialog4=Ei chefe, n\u00F3s encontramos um mapa interessante nas ru\u00EDnas. Ele mostra uma ilha que n\u00F3s n\u00E3o conhec\u00EDamos, ent\u00E3o eu desenhei ela em nosso mapa agora. Talvez seja l\u00E1 onde Fjorleif est\u00E1 se escondendo?
game_over=Todos os aliados foram mortos. Fim de jogo.
name1=Aliados
name2=Vikings
name3=Vikings
objective=Destrua os Vikings.\nProteja seus Aliados.
