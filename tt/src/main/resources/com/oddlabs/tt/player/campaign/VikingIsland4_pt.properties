header=Gobazumbi
description=Os restos de um navio Viking foram avistados nas \u00E1guas perto dessa ilha. Talvez existem outros valentes Vikings que sofreram o mesmo destino de n\u00F3s.
header0=Chefe Fjorleif
dialog0=O naufr\u00E1gio acabou que pertencia ao meu primo Gunnar o Ing\u00EAnuo, que est\u00E1 sendo mantido cativo pelos ind\u00EDgenas agora. Vamos ajudar ele!
header1=Chefe Gunnar
dialog1=Obrigado por me libertar! Talvez eu devia ter escutado aos meus homens, mas eu estava certo de que os ind\u00EDgenas iriam convidar todos n\u00F3s pra jantar. Por\u00E9m eu ainda consegui praticar minhas habilidades com a lura um pouco, Deixe-me te ensinar a como tocar o Toque Aterrorizante, que pode atordoar seus inimigos por um breve tempo.
game_over=Chefe Gunnar foi morto. Fim de jogo.
name1=Gunnar
name2=Ind\u00EDgenas
objective=Destrua os ind\u00EDgenas.\nResgate Gunnar.
