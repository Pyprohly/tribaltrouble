header=Kogafutshlum
description=A ilha escondida onde o grande deus do trov\u00E3o Xarrr reside no topo da montanha. Se alcan\u00E7armos o topo, talvez n\u00F3s seremos concedidos um desejo.
header0=Chefe Fjorleif
dialog0=Essa tem que ser a montanha que o Chefe Mozumba mencionou. Precisamos alcan\u00E7ar o topo dela, mas n\u00E3o estou certo de que os ind\u00EDgenas v\u00E3o nos deixar passar sem uma luta. Talvez podemos encontrar outro caminho?
header1=Chefe Fjorleif
dialog1=Finalmente, chegamos ao topo! Agora onde est\u00E1 esse deus do trov\u00E3o... tudo que eu vejo \u00E9 uma pequena est\u00E1tua feia!
header2=Xarrr O Trovejante
dialog2=O QUE TRAZ VOC\u00CA \u00C0 MINHA MORADA, MORTAL?
header3=Chefe Fjorleif
dialog3=Credo, a est\u00E1tua est\u00E1 falando! \u00C9\u00E9\u00E9... oh, Grande Xarrr, O Chefe Mozumba me contou que se n\u00F3s sub\u00EDssemos sua montanha, voc\u00EA podia ser t\u00E3o gentil pra nos conceder um... \u00E9 ...
header4=Xarrr O Trovejante
dialog4=UM DESEJO?
header5=Chefe Fjorleif
dialog5=*glup* Sim, era isso!
header6=Xarrr O Trovejante
dialog6=Muito bem, o que voc\u00EA deseja, mortal?
header7=Chefe Fjorleif
dialog7=Uhm... Eu desejo que meus inimigos desmoronassem diante de mim!
header8=Xarrr O Trovejante
dialog8=Tudo bem, de agora em diante voc\u00EA poder\u00E1 usar sua lura para criar o Rugido Devastador que ir\u00E1 estra\u00E7alhar qualquer coisa ao seu arredor!
header9=Chefe Fjorleif
dialog9=Uau, obrigado ... Eu acho.
header10=Xarrr O Trovejante
dialog10=Agora, se me der licen\u00E7a... Eu tenho tempestades para atender.
header11=Chefe Fjorleif
dialog11=Hmm... Isso talvez explique a tempestade furiosa que colocou a gente aqui em primeiro lugar. Ah bem, melhor testar aquele novo Rugido Devastador antes de irmos. Apenas fa\u00E7a uma pequena demonstra\u00E7\u00E3o bem aqui.
statue=Xarrr O Trovejante
name2=Ind\u00EDgenas
objective0=Alcance o topo da montanha.
objective1=Toque um Toque Aterrorizante no topo da montanha.
