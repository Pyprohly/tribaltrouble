header=Fufupogo
description=Um dos navios de nossos rivais foi avistado pr\u00F3ximo dessa ilha. Takvez ekes descobriram sobre o tesouro dos ind\u00EDgenas tamb\u00E9m.
header0=Chefe Fjorleif
dialog0=Ah n\u00E3o, meu arqui-rival Egill Cabe\u00E7a de Ovo conquistou essa ilha. Sem sombra de d\u00FAvidas ele est\u00E1 atr\u00E1s do tesouro dos ind\u00EDgenas tamb\u00E9m. Credo, Eu acho que ele nos viu!
header1=Egill Cabe\u00E7a de Ovo
dialog1=Fjorleif Peidorreiro, nos encontramos de novo!
header2=Chefe Fjorleif
dialog2=*Resmunga* ... N\u00E3o me chame pelo meu nome completo enquanto meus homens estiverem escutando!
header3=Egill Cabe\u00E7a de Ovo
dialog3=Bem, Estou aqui para te informar que esse grupo de ilhas agora \u00E9 propriedade da Companhia de Saqueamento Cabe\u00E7a de Ovo, e que sua presen\u00E7a requer que voc\u00EA pague uma Taxa de licen\u00E7a de saqueamento de um barril de ouro por dia. Voc\u00EA concorda com esses termos?
header4=Chefe Fjorleif
dialog4=O qu\u00EA?!? Mas n\u00F3s chegamos aqui primeiro!
header5=Egill Cabe\u00E7a de Ovo
dialog5=Obviamente n\u00E3o. Eu vou entender isso como um n\u00E3o ent\u00E3o. Meus guerreiros ver\u00E3o como \u00E9 expulso desta ilha com violentas e em geral desagrad\u00E1veis maneiras. Bom dia!
header6=Chefe Fjorleif
dialog6=Aquele bastardo... ele n\u00E3o se safar\u00E1 com isso!
header7=Petur O Pe\u00E3o
dialog7=Peidorreiro, hein?
header8=Chefe Fjorleif
dialog8=Apenas cale a boca e lute!
name2=Cabe\u00E7as de Ovo
objective=Destrua os Cabe\u00E7as de Ovo.
