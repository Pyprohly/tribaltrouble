header=V\u00F6llurstr\u00F6nd
description=A ilha de Gunnar. Ele nos disse que alguns de nossos parentes foram levados como prisioneiros, ent\u00E3o talvez alguns deles podem ter terminado aqui. Se eles tiverem, n\u00F3s precisamos libertar eles agora mesmo!
header0=Zimfubo O Zeloso
dialog0=Olhe chefe! Gunnar estava certo, eles levaram alguns de nossos parentes com eles, provavelmente para usar eles como ref\u00E9ns. Mostre a eles a sua f\u00FAria e libere a N\u00FAvem Crepitante
header1=Chefe Ngumba
dialog1=Maldi\u00E7\u00E3o! N\u00E3o consigo faz\u00EA-la funcionar nesse clima frio. Ou talvez n\u00F3s estamos apenas muito longe do dom\u00EDnio de O Grande Xarrr. Parece que vamos ter que fazer isso da maneira antiga... vamos l\u00E1!
header2=Chefe Ngumba
dialog2=Voc\u00EAs est\u00E3o livres agora pequenos companheiros, chega de trabalhar para os Vikings!\n\nBem, n\u00E3o fiquem a\u00ED parados - voltem ao trabalho e construam-me uma vila para que assim podemos criar um ex\u00E9rcito enorme e derrotarmos aqueles Vikings!
