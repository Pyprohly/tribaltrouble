header=Lumumgumphe
description=O navio n\u00E3o pode cruzar atrav\u00E9s do recife com o Chefe Fjorleif e seus homens meio acima do peso a bordo. Ao inv\u00E9s disso, eles ter\u00E3o que atravessar a ilha \u00E0 p\u00E9 enquanto seu imediato navega o navio atrav\u00E9s do recife.
header0=Chief Fjorleif
dialog0=Tomem cuidado, homens! Essa ilha est\u00E1 lotada de ind\u00EDgenas hostis, ent\u00E3o n\u00F3s temos que ter aten\u00E7\u00E3o com nossos passos. Precisamos chegar a esse ponto de encontro no outro lado da ilha.
header1=Ponto de enconto alcan\u00E7ado
dialog1=Voc\u00EA alcan\u00E7ou o ponto de encontro. Sinalize tocando o Toque Aterrorizante com a sua lura para seu navio vir pegar voc\u00EA.
header2=Steingrim Esmagador de Cr\u00E2nios
dialog2=Salve! Nosso navio naufragou nos recifes, ent\u00E3o n\u00F3s estivemos encalhados aqui por um tempo. N\u00F3s nos escondemos dos ind\u00EDgenas ficando nesse vale, ent\u00E3o voc\u00EA \u00E9 mais que bem-vindo! N\u00F3s vamos se juntar a voc\u00EA com prazer, j\u00E1 que essa pode ser nossa \u00FAnica chance de sa\u00EDrmos.
name1=Encalhados
name2=Ind\u00EDgenas
objective0=Chegue ao ponto de encontro.
objective1=Fa\u00E7a um Toque Aterrorizante pr\u00F3ximo do ponto de encontro.
